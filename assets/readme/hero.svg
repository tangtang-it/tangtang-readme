<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="糖糖it README 美化坊 — 让每个开源项目都有第一眼吸引力">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="25%" stop-color="#FFE8F7"/>
      <stop offset="50%" stop-color="#E0F9FF"/>
      <stop offset="75%" stop-color="#E4FFE1"/>
      <stop offset="100%" stop-color="#FFF8D4"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FE90E8"/><stop offset="100%" stop-color="#FF6BB5"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0F7FE"/><stop offset="100%" stop-color="#7DEBFB"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7CB46"/><stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99E885"/><stop offset="100%" stop-color="#66D94F"/>
    </linearGradient>
    <linearGradient id="cream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDC8B"/><stop offset="100%" stop-color="#FFC857"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- 点阵背景装饰 -->
  <g opacity="0.3">
    <circle cx="60" cy="60" r="3" fill="#000"/><circle cx="120" cy="40" r="2" fill="#000"/>
    <circle cx="180" cy="80" r="2.5" fill="#000"/><circle cx="1050" cy="50" r="3" fill="#000"/>
    <circle cx="1120" cy="90" r="2" fill="#000"/><circle cx="1080" cy="350" r="2.5" fill="#000"/>
    <circle cx="80" cy="360" r="2" fill="#000"/><circle cx="150" cy="380" r="3" fill="#000"/>
  </g>

  <!-- 左上装饰 -->
  <g transform="translate(70,50)">
    <rect x="0" y="0" width="56" height="56" fill="url(#pink)" stroke="#000" stroke-width="3" transform="rotate(12)"/>
    <text x="28" y="38" font-family="Arial,sans-serif" font-size="24" font-weight="900" text-anchor="middle" fill="#FFF" transform="rotate(12,28,28)">{</text>
  </g>
  <g transform="translate(160,35)">
    <circle cx="0" cy="0" r="20" fill="url(#yellow)" stroke="#000" stroke-width="3"/>
    <circle cx="-5" cy="-5" r="5" fill="#FFF" opacity="0.5"/>
  </g>

  <!-- 右上装饰 -->
  <g transform="translate(1080,60)">
    <rect x="0" y="0" width="50" height="50" fill="url(#blue)" stroke="#000" stroke-width="3" transform="rotate(-15)"/>
    <text x="25" y="35" font-family="Arial,sans-serif" font-size="22" font-weight="900" text-anchor="middle" fill="#000" transform="rotate(-15,25,25)">&gt;</text>
  </g>
  <g transform="translate(1000,45)">
    <polygon points="0,-22 6,-7 22,-7 9,3 14,18 0,9 -14,18 -9,3 -22,-7 -6,-7" fill="url(#cream)" stroke="#000" stroke-width="2.5"/>
  </g>

  <!-- 左下装饰 -->
  <g transform="translate(80,330)">
    <rect x="0" y="0" width="44" height="44" fill="url(#green)" stroke="#000" stroke-width="3" transform="rotate(-8)"/>
    <text x="22" y="32" font-family="Arial,sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#000" transform="rotate(-8,22,22)">/</text>
  </g>
  <g transform="translate(160,360)">
    <circle cx="0" cy="0" r="16" fill="url(#pink)" stroke="#000" stroke-width="2.5"/>
  </g>

  <!-- 右下装饰 -->
  <g transform="translate(1090,340)">
    <rect x="0" y="0" width="48" height="48" fill="url(#yellow)" stroke="#000" stroke-width="3" transform="rotate(10)"/>
    <text x="24" y="34" font-family="Arial,sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#000" transform="rotate(10,24,24)">&gt;</text>
  </g>
  <g transform="translate(1020,370)">
    <circle cx="0" cy="0" r="18" fill="url(#blue)" stroke="#000" stroke-width="2.5"/>
    <circle cx="-4" cy="-4" r="4" fill="#FFF" opacity="0.6"/>
  </g>

  <!-- 左侧大装饰块（用偏移模拟阴影） -->
  <g transform="translate(130,200)">
    <rect x="-35" y="-35" width="70" height="70" fill="#000" opacity="0.12"/>
    <rect x="-31" y="-31" width="70" height="70" fill="url(#blue)" stroke="#000" stroke-width="4"/>
    <text x="0" y="12" font-family="Consolas,'Courier New',monospace" font-size="36" font-weight="900" text-anchor="middle" fill="#000">&lt;/&gt;</text>
  </g>

  <!-- 右侧大装饰块 -->
  <g transform="translate(1070,200)">
    <rect x="-35" y="-35" width="70" height="70" fill="#000" opacity="0.12"/>
    <rect x="-31" y="-31" width="70" height="70" fill="url(#green)" stroke="#000" stroke-width="4"/>
    <text x="0" y="14" font-family="Arial,sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="#000">SVG</text>
  </g>

  <!-- 小糖果点缀 -->
  <circle cx="220" cy="120" r="10" fill="url(#pink)" stroke="#000" stroke-width="2"/>
  <circle cx="980" cy="130" r="12" fill="url(#yellow)" stroke="#000" stroke-width="2"/>
  <circle cx="250" cy="310" r="9" fill="url(#cream)" stroke="#000" stroke-width="2"/>
  <circle cx="950" cy="300" r="11" fill="url(#pink)" stroke="#000" stroke-width="2"/>
  <circle cx="200" cy="200" r="7" fill="url(#green)" stroke="#000" stroke-width="2"/>
  <circle cx="1000" cy="210" r="8" fill="url(#blue)" stroke="#000" stroke-width="2"/>

  <!-- 主卡片阴影（偏移黑矩形模拟硬阴影） -->
  <g transform="translate(270,90)">
    <rect x="4" y="4" width="660" height="240" fill="#000" opacity="0.15"/>
    <rect x="0" y="0" width="660" height="240" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
    <rect x="0" y="0" width="660" height="12" fill="url(#pink)"/>
    <!-- 装饰角 -->
    <rect x="-8" y="-8" width="24" height="24" fill="url(#yellow)" stroke="#000" stroke-width="3"/>
    <rect x="644" y="-8" width="24" height="24" fill="url(#blue)" stroke="#000" stroke-width="3"/>
    <rect x="-8" y="224" width="24" height="24" fill="url(#green)" stroke="#000" stroke-width="3"/>
    <rect x="644" y="224" width="24" height="24" fill="url(#cream)" stroke="#000" stroke-width="3"/>
  </g>

  <!-- 主标题 -->
  <text x="600" y="185" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="#000" letter-spacing="-0.02em">糖糖it</text>

  <!-- 副标题黄色背景块 -->
  <rect x="400" y="205" width="400" height="44" fill="url(#yellow)" stroke="#000" stroke-width="3"/>
  <text x="600" y="237" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#000" letter-spacing="0.15em">README 美化坊</text>

  <!-- 标语 -->
  <text x="600" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#333">让每个开源项目，都有第一眼吸引力</text>
  <text x="772" y="290" font-size="22" text-anchor="middle" fill="#000">🍬</text>

  <!-- 标签 -->
  <g transform="translate(380,305)">
    <rect x="0" y="0" width="80" height="26" rx="13" fill="url(#pink)" stroke="#000" stroke-width="2"/>
    <text x="40" y="18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#000">纯 SVG</text>
  </g>
  <g transform="translate(475,305)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="url(#blue)" stroke="#000" stroke-width="2"/>
    <text x="50" y="18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#000">主题丰富</text>
  </g>
  <g transform="translate(590,305)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="url(#green)" stroke="#000" stroke-width="2"/>
    <text x="50" y="18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#000">工程友好</text>
  </g>
  <g transform="translate(705,305)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="url(#cream)" stroke="#000" stroke-width="2"/>
    <text x="50" y="18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#000">可选动效</text>
  </g>
</svg>