<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">项目标题 Banner - 极简暗色</title>
  <desc id="desc">极简暗色背景配单一蓝色强调的 GitHub README Banner，适合技术产品</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <!-- 网格装饰 -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="420"/><line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/><line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/><line x1="1100" y1="0" x2="1100" y2="420"/>
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>
  <!-- 顶部装饰线 -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>
  <!-- 角落装饰 -->
  <rect x="80" y="60" width="24" height="3" fill="#58a6ff"/><rect x="80" y="60" width="3" height="24" fill="#58a6ff"/>
  <rect x="1096" y="60" width="24" height="3" fill="#3fb950"/><rect x="1117" y="60" width="3" height="24" fill="#3fb950"/>
  <rect x="80" y="357" width="24" height="3" fill="#3fb950"/><rect x="80" y="336" width="3" height="24" fill="#3fb950"/>
  <rect x="1096" y="357" width="24" height="3" fill="#58a6ff"/><rect x="1117" y="336" width="3" height="24" fill="#58a6ff"/>
  <!-- 主标题 -->
  <text x="600" y="175" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="80" font-weight="800" text-anchor="middle" fill="#f0f6fc" letter-spacing="-0.03em">项目名称</text>
  <!-- 副标题 -->
  <text x="600" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#8b949e">一句话价值主张</text>
  <!-- 分割线 -->
  <line x1="470" y1="265" x2="730" y2="265" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#6e7681">简短描述项目的核心功能与价值</text>
  <!-- 标签 -->
  <g transform="translate(410,330)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="40" y="18" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="500" text-anchor="middle" fill="#58a6ff">开源</text>
  </g>
  <g transform="translate(510,330)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <text x="40" y="18" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#3fb950">MIT</text>
  </g>
  <g transform="translate(610,330)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="none" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="40" y="18" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#d2a8ff">TypeScript</text>
  </g>
  <g transform="translate(710,330)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="none" stroke="#ffa657" stroke-width="1.5"/>
    <text x="40" y="18" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="500" text-anchor="middle" fill="#ffa657">v1.0</text>
  </g>
  <!-- 代码装饰 -->
  <text x="170" y="260" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#484f58" opacity="0.6">$ npm install</text>
  <text x="170" y="280" font-family="Consolas,'Courier New',monospace" font-size="11" fill="#484f58" opacity="0.6">$ npm start</text>
  <!-- 圆点 -->
  <circle cx="1050" cy="380" r="3" fill="#58a6ff" opacity="0.3"/>
  <circle cx="1070" cy="375" r="2" fill="#3fb950" opacity="0.3"/>
  <circle cx="1090" cy="382" r="2.5" fill="#d2a8ff" opacity="0.3"/>
</svg>