<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">项目标题 Banner - 几何抽象</title>
  <desc id="desc">大胆几何色块、高对比度、极简主义的抽象风格 GitHub README Banner</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/><stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <!-- 几何色块 -->
  <rect x="0" y="0" width="180" height="180" fill="#FF6B6B" opacity="0.85"/>
  <rect x="180" y="0" width="140" height="140" fill="#4ECDC4" opacity="0.85"/>
  <rect x="320" y="0" width="100" height="100" fill="#FFE66D" opacity="0.85"/>
  <rect x="420" y="0" width="200" height="160" fill="#292F36" opacity="0.85"/>
  <!-- 右侧几何 -->
  <rect x="1020" y="240" width="180" height="180" fill="#4ECDC4" opacity="0.85"/>
  <rect x="880" y="290" width="140" height="130" fill="#FF6B6B" opacity="0.85"/>
  <rect x="760" y="350" width="120" height="70" fill="#FFE66D" opacity="0.85"/>
  <!-- 底部几何 -->
  <rect x="0" y="320" width="220" height="100" fill="#292F36" opacity="0.85"/>
  <rect x="220" y="360" width="160" height="60" fill="#4ECDC4" opacity="0.85"/>
  <rect x="380" y="380" width="100" height="40" fill="#FF6B6B" opacity="0.85"/>
  <!-- 小圆点 -->
  <circle cx="640" cy="80" r="8" fill="#292F36"/><circle cx="680" cy="60" r="5" fill="#FFE66D"/>
  <circle cx="540" cy="350" r="6" fill="#FF6B6B"/><circle cx="580" cy="380" r="4" fill="#4ECDC4"/>
  <circle cx="650" cy="390" r="7" fill="#292F36"/>
  <!-- 主内容区背景 -->
  <rect x="200" y="95" width="800" height="230" fill="#ffffff"/>
  <!-- 标题卡左侧色条 -->
  <rect x="200" y="95" width="8" height="230" fill="#FF6B6B"/>
  <!-- 主标题 -->
  <text x="600" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="72" font-weight="900" text-anchor="middle" fill="#292F36" letter-spacing="-0.02em">项目名称</text>
  <!-- 副标题 -->
  <text x="600" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FF6B6B" letter-spacing="0.08em">一句话价值主张</text>
  <!-- 描述 -->
  <text x="600" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#6b7280">简短描述项目解决的核心问题</text>
  <!-- 标签 -->
  <g transform="translate(355,300)">
    <rect x="0" y="0" width="90" height="28" fill="#FF6B6B"/>
    <text x="45" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">开源</text>
  </g>
  <g transform="translate(465,300)">
    <rect x="0" y="0" width="90" height="28" fill="#4ECDC4"/>
    <text x="45" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">快速</text>
  </g>
  <g transform="translate(575,300)">
    <rect x="0" y="0" width="90" height="28" fill="#292F36"/>
    <text x="45" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#FFE66D">简洁</text>
  </g>
  <g transform="translate(685,300)">
    <rect x="0" y="0" width="90" height="28" fill="#FFE66D"/>
    <text x="45" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#292F36">MIT</text>
  </g>
  <g transform="translate(795,300)">
    <rect x="0" y="0" width="90" height="28" fill="#FF6B6B"/>
    <text x="45" y="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">v1.0</text>
  </g>
</svg>